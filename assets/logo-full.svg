<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 100" width="100%" height="100%">
  <!-- Icon Group -->
  <g transform="translate(10, 10)">
    <!-- Isometric Cube representing Structure, Risk, Resilience -->
    <polygon points="40,8 72,24 40,40 8,24" fill="#ffffff" stroke="#FF6B00" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="8,24 40,40 40,72 8,56" fill="#FF6B00" stroke="#FF6B00" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="40,40 72,24 72,56 40,72" fill="#121212" stroke="#121212" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Inner geometric intersection / lines -->
    <polyline points="40,40 40,16" stroke="#121212" stroke-width="2" stroke-linecap="round"/>
    <polyline points="40,40 16,52" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <polyline points="40,40 64,52" stroke="#FF6B00" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Text Group -->
  <text x="100" y="42" font-family="'Inter', sans-serif" font-weight="500" font-size="20" fill="#5A5A5A">Institute of</text>
  <text x="100" y="78" font-family="'Outfit', sans-serif" font-weight="800" font-size="34" fill="#121212">Digital <tspan fill="#FF6B00">Risk</tspan></text>
</svg>
