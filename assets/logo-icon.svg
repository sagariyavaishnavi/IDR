<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Isometric Cube representing Structure, Risk, Resilience -->
  <!-- Top Face (White) -->
  <polygon points="50,10 90,30 50,50 10,30" fill="#ffffff" stroke="#FF6B00" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left Face (Orange) -->
  <polygon points="10,30 50,50 50,90 10,70" fill="#FF6B00" stroke="#FF6B00" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right Face (Black) -->
  <polygon points="50,50 90,30 90,70 50,90" fill="#121212" stroke="#121212" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Inner geometric intersection / lines to show resilience -->
  <polyline points="50,50 50,20" stroke="#121212" stroke-width="2" stroke-linecap="round"/>
  <polyline points="50,50 20,65" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <polyline points="50,50 80,65" stroke="#FF6B00" stroke-width="2" stroke-linecap="round"/>
</svg>
